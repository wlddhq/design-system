# Every push to main and every pull request: the packages must build, typecheck, pass the package
# linters, and work in a blank Next.js app installed from the packed tarballs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w docs
      - run: npm run lint:package
      - run: npm run release:check
      - run: npm run smoke
