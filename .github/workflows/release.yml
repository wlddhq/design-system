# Stages @wldd/tokens, @wldd/tailwind and @wldd/ui on npm when a version tag (v0.1.5) is pushed.
# No npm token: npm trusts this workflow directly (Trusted Publishing, set per package on npmjs.com),
# and every version carries a provenance statement linking it to this commit and this run.
# Staged means nothing is live until a maintainer approves each package on npmjs.com with 2FA.
# After approving, run the Published workflow (published.yml).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # npm trusted publishing + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer (npm 12 needs a newer Node 22 than the runner may have).
      - run: npm install -g npm@11
      - run: npm ci
      # Tag must equal the packages' version; changelog must have the dated entry.
      - run: npm run release:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint:package
      - run: npm run smoke

      - name: Stage on npm (skips any package already on npm at this version, so a re-run is safe)
        run: |
          v=$(node -p "require('./packages/ui/package.json').version")
          for p in tokens tailwind ui; do
            if npm view "@wldd/$p@$v" version >/dev/null 2>&1; then
              echo "@wldd/$p@$v is already on npm, skipping"
            else
              npm stage publish -w "@wldd/$p" --provenance --access public
            fi
          done
          {
            echo "### Staged @wldd/tokens, @wldd/tailwind and @wldd/ui $v"
            echo "Nothing is live yet. Approve each one on npmjs.com (2FA), or: \`npm stage list\` then \`npm stage approve <id>\`."
            echo "Then run the **Published** workflow: \`gh workflow run published.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"
