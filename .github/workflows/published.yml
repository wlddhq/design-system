# Run after approving a staged release on npmjs.com:  gh workflow run published.yml
# Checks a blank Next.js app builds with the versions now live on npm, then creates the GitHub release
# from the changelog entry.
name: Published

on:
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: All three packages are live at this version
        run: |
          v=$(node -p "require('./packages/ui/package.json').version")
          for p in tokens tailwind ui; do
            npm view "@wldd/$p@$v" version >/dev/null 2>&1 || { echo "::error::@wldd/$p@$v is not on npm yet. Approve it on npmjs.com first."; exit 1; }
          done
      - run: npm run smoke -- --registry
      - name: GitHub release with the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./packages/ui/package.json').version")
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --title "v$v" --notes-file notes.md --verify-tag
